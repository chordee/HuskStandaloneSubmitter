[project]
name = "husk-submitter"
version = "0.1.0"
description = "Houdini-side Deadline submitter for the HuskStandalone plugin"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
# Houdini provides pxr at runtime; usd-core is only used to run the tests
dev = ["pytest", "usd-core"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["python"]
